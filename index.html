<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/google.png"/>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <title>Submit Recommendations</title>
</head>

<body>
  <a href="#main">Skip to Main Content</a>

  <main id="main">
  <h1>Submit Recommendations</h1>

  <form action="https://formspree.io/f/mwllaolk" method="POST" enctype="multipart/form-data">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <fieldset class="radio">
      <legend>Area of Submission:</legend>

      <input type="radio" id="travel" name="interest" value="travel" required>
      <label for="travel">Travel</label><br>

      <input type="radio" id="recipe" name="interest" value="recipe">
      <label for="recipe">Recipe</label><br>

      <input type="radio" id="pets" name="interest" value="pets">
      <label for="pets">Pets</label>
    </fieldset>

    <label for="message">Message:</label>
    <textarea id="message" name="message" required></textarea>

    <label for="image">Upload Image:</label>
    <input type="file" id="image" name="image" accept="image/*">

    <input type="submit" value="Submit">
    <button type="reset">Reset</button>

  </form>
  </main>
</body>
</html>
